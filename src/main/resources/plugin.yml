name: RTPFightQueue
version: 1.0.0
main: com.rtpfightqueue.RTPFightQueue
api-version: '26.2'
author: Custom
description: Complete lobby RTP zone + fight queue

commands:
  rtpqueue:
    description: Open the RTP Fight Queue GUI
    usage: /rtpqueue
  rtpzone:
    description: Create and manage RTP queue zones
    usage: /rtpzone <wand|pos1|pos2|create|enable|disable|info|reload>

permissions:
  rtpqueue.use:
    default: true
  rtpqueue.admin:
    default: op
